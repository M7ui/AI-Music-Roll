<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Piano Roll</title>
<style>
:root {
  --bg: #0b0b1e; --surf: #111130; --grid-bg: #0e0e26; --grid-sub: #161636;
  --grid-b: #222250; --grid-bar: #3a3a68; --row-c: #161638; --kw-bg: #1c1c3c;
  --kb-bg: #10102a; --kt: #555578; --ktc: #8888bb; --note: #00d4aa;
  --head: #ff2255; --txt: #ddddef; --txtd: #666688; --acc: #7c6cf7;
  --acc-h: #9c8cff; --inp-bg: #16163a; --chat-bg: #0a0a1e; --err: #ff4466;
  --tool-bg: #0e0e28;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--txt);font-family:Consolas,monospace;overflow:hidden;user-select:none;display:flex;flex-direction:column;height:100vh}
#toolbar{background:var(--tool-bg);padding:8px 14px;display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap}
#toolbar label{color:var(--txtd);font-size:11px;white-space:nowrap}
#toolbar input,#toolbar select{background:var(--inp-bg);color:var(--txt);border:1px solid var(--acc);padding:4px 6px;border-radius:3px;font-family:Consolas,monospace;font-size:11px;outline:none}
#toolbar input:focus,#toolbar select:focus{border-color:var(--acc-h)}
#vel-slider{width:80px;accent-color:var(--acc)}
#toolbar button{padding:5px 12px;border:none;border-radius:3px;font-family:Consolas,monospace;font-size:11px;font-weight:bold;cursor:pointer;color:#fff}
#toolbar button:hover{filter:brightness(1.2)}
.btn-play{background:#22aa66}.btn-stop{background:#aa4444}.btn-clear{background:#884488}.btn-config{background:var(--acc)}.btn-midi{background:#2a4a8a}.btn-save{background:#2a8a6a}.btn-clear-saved{background:#884444}
.sep{color:var(--txtd);margin:0 2px}
#main{display:flex;flex:1;min-height:0}
#roll-panel{flex:1;display:flex;min-width:0;position:relative;overflow:hidden}
#keys-canvas{background:var(--kb-bg);flex-shrink:0}
#grid-wrap{flex:1;overflow:auto;position:relative}
#grid-canvas{display:block;cursor:crosshair}
#chat-panel{width:380px;background:var(--chat-bg);display:flex;flex-direction:column;flex-shrink:0;border-left:1px solid #1a1a3a}
#chat-title{padding:12px 14px 6px;font-size:13px;font-weight:bold;color:var(--acc)}
#notes-panel{width:280px;background:#0a0a1e;display:flex;flex-direction:column;flex-shrink:0;border-left:1px solid #1a1a3a}
#notes-title{padding:10px 12px;font-size:12px;font-weight:bold;color:#7c6cf7;border-bottom:1px solid #1a1a3a}
#notes-list{flex:1;overflow-y:auto;padding:6px;font-size:11px;line-height:1.4}
#notes-panel .btn-export{width:100%;padding:5px;background:#2a4a8a;color:#fff;border:none;border-radius:3px;font-size:10px;cursor:pointer;margin-bottom:3px}
#notes-panel .btn-export:hover{filter:brightness(1.2)}
#notes-panel .btn-import{width:100%;padding:5px;background:#4a4a2a;color:#fff;border:none;border-radius:3px;font-size:10px;cursor:pointer}
#chat-msgs{flex:1;overflow-y:auto;padding:6px 12px;font-size:12px;line-height:1.6}
#chat-msgs .u{color:#88aaff;font-weight:bold}#chat-msgs .ut{color:#ccccff}
#chat-msgs .al{color:var(--note);font-weight:bold}#chat-msgs .at{color:var(--txt)}
#chat-msgs .at h1,#chat-msgs .at h2,#chat-msgs .at h3,#chat-msgs .at h4{color:var(--acc);margin:8px 0 4px;font-weight:bold}
#chat-msgs .at h1{font-size:15px}#chat-msgs .at h2{font-size:14px}#chat-msgs .at h3{font-size:13px}#chat-msgs .at h4{font-size:12px}
#chat-msgs .at code{background:#1a1a3a;color:#ff9955;padding:1px 5px;border-radius:3px;font-size:11px;font-family:Consolas,monospace}
#chat-msgs .at pre{background:#0a0a1e;border:1px solid #1a1a3a;border-radius:4px;padding:8px 10px;margin:6px 0;overflow-x:auto;font-size:11px;line-height:1.5}
#chat-msgs .at pre code{background:none;color:var(--txt);padding:0;font-size:11px}
#chat-msgs .at blockquote{border-left:3px solid var(--acc);margin:6px 0;padding:2px 10px;color:#9999bb;font-style:italic}
#chat-msgs .at ul,#chat-msgs .at ol{margin:4px 0;padding-left:20px}
#chat-msgs .at li{margin:2px 0}
#chat-msgs .at hr{border:none;border-top:1px solid #1a1a3a;margin:8px 0}
#chat-msgs .at strong{color:#ffffff;font-weight:bold}
#chat-msgs .at em{color:#ccccff;font-style:italic}
#chat-msgs .at table{border-collapse:collapse;margin:6px 0;font-size:11px}
#chat-msgs .at th,#chat-msgs .at td{border:1px solid #1a1a3a;padding:3px 8px;text-align:left}
#chat-msgs .at th{background:#0e0e28;color:var(--acc)}
#chat-msgs .tt{color:var(--txtd);font-size:11px;font-style:italic}#chat-msgs .et{color:var(--err)}#chat-msgs .st{color:#555578;font-size:11px}
#chat-msgs .think{display:flex;align-items:center;gap:4px;color:var(--acc);padding:6px 0}
#chat-msgs .think .dot{width:5px;height:5px;border-radius:50%;background:var(--acc);animation:thinkBounce 1.2s infinite ease-in-out}
#chat-msgs .think .dot:nth-child(1){animation-delay:0s}
#chat-msgs .think .dot:nth-child(2){animation-delay:.15s}
#chat-msgs .think .dot:nth-child(3){animation-delay:.3s}
@keyframes thinkBounce{0%,60%,100%{transform:translateY(0);opacity:.3}30%{transform:translateY(-6px);opacity:1}}
#chat-msgs .reasoning{margin:4px 0;border:1px solid #1a1a4a;border-radius:4px;overflow:hidden}
#chat-msgs .reasoning summary{cursor:pointer;padding:4px 8px;background:#0e0e28;color:#7777aa;font-size:11px;user-select:none}
#chat-msgs .reasoning summary:hover{color:var(--acc)}
#chat-msgs .reasoning .rc{max-height:160px;overflow-y:auto;padding:4px 8px;font-size:11px;color:#666699;line-height:1.5;word-break:break-word}
#chat-msgs .reasoning-stream{padding:4px 8px;font-size:11px;color:#666699;line-height:1.5;word-break:break-word;max-height:200px;overflow-y:auto}
#chat-msgs .reasoning-stream code{background:#0e0e1e;color:#aa8888;padding:0 3px;border-radius:2px}
#chat-msgs .reasoning-stream strong{color:#9999cc}
#chat-msgs .rc code{background:#0e0e1e;color:#aa8888;padding:0 3px;border-radius:2px}
#chat-msgs .rc strong{color:#9999cc}
#chat-input-wrap{display:flex;padding:8px 10px;gap:6px;border-top:1px solid #1a1a3a}
#chat-input{flex:1;background:var(--inp-bg);color:var(--txt);border:1px solid #2a2a4a;border-radius:3px;padding:7px 10px;font-family:Consolas,monospace;font-size:12px;outline:none}
#chat-input:focus{border-color:var(--acc)}
#chat-send{background:var(--acc);color:#fff;border:none;border-radius:3px;padding:7px 14px;cursor:pointer;font-family:Consolas,monospace;font-size:11px;font-weight:bold}
#chat-send:hover{background:var(--acc-h)}#chat-send:disabled{opacity:.5;cursor:not-allowed}
#status{background:var(--tool-bg);padding:4px 14px;font-size:11px;color:var(--txtd);flex-shrink:0}
#modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;justify-content:center;align-items:center}
#modal-overlay.active{display:flex}
#modal{background:var(--surf);border:1px solid #2a2a5a;border-radius:8px;padding:28px 32px;min-width:420px}
#modal h2{color:var(--acc);font-size:18px;margin-bottom:4px}
#modal p.desc{color:var(--txtd);font-size:11px;margin-bottom:18px}
#modal .row{display:flex;align-items:center;margin:8px 0}
#modal .row label{width:80px;color:var(--txt);font-size:12px;flex-shrink:0}
#modal .row input{flex:1;background:var(--inp-bg);color:var(--txt);border:1px solid #2a2a4a;border-radius:3px;padding:7px 10px;font-family:Consolas,monospace;font-size:12px;outline:none}
#modal .row input:focus{border-color:var(--acc)}
#modal .btns{display:flex;gap:10px;margin-top:20px;justify-content:flex-end}
#modal .btns button{padding:7px 20px;border:none;border-radius:3px;font-family:Consolas,monospace;font-size:12px;font-weight:bold;cursor:pointer;color:#fff}
#modal .btns .ok{background:var(--acc)}
#modal .btns .cancel{background:var(--surf);border:1px solid #2a2a4a}

#modal .btns .test:hover{background:#3a8a4a}
#modal .btns .test:disabled{opacity:.5;cursor:not-allowed}
#cfg-feedback{min-height:18px;font-size:11px;margin:6px 0 0;text-align:center}
#cfg-feedback.ok{color:var(--note)}#cfg-feedback.err{color:var(--err)}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--txtd);border-radius:3px}
#sound-badge{display:inline-block;background:#1a3a2a;color:#44cc88;font-size:10px;padding:2px 6px;border-radius:3px;margin-left:4px;vertical-align:middle}
#term-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:200;flex-direction:column;font-family:Consolas,monospace}
#term-overlay.active{display:flex}
#term-header{background:#0a0a24;padding:6px 14px;font-size:11px;color:var(--acc);border-bottom:1px solid #1a1a4a;display:flex;align-items:center;gap:10px}
#term-header span{color:var(--txtd)}
#term-close{background:none;border:1px solid #3a3a5a;color:var(--txtd);border-radius:3px;cursor:pointer;padding:2px 8px;font-family:Consolas,monospace;font-size:10px;margin-left:auto}
#term-close:hover{color:var(--err);border-color:var(--err)}
#term-output{flex:1;overflow-y:auto;padding:8px 14px;font-size:11px;line-height:1.4;white-space:pre-wrap;word-break:break-all}
#term-output .cmd{color:#55dd77}#term-output .err{color:var(--err)}#term-output .info{color:var(--acc)}#term-output .time{color:var(--txtd)}
#term-input-wrap{display:flex;border-top:1px solid #1a1a4a}
#term-prompt{color:#55dd77;padding:8px 0 8px 14px;font-size:12px;flex-shrink:0}
#term-input{flex:1;background:transparent;border:none;color:var(--txt);padding:8px 8px 8px 0;font-family:Consolas,monospace;font-size:12px;outline:none}
#term-input::placeholder{color:#333355}
</style>

<script>
const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const BLACK_KEYS = new Set([1,3,6,8,10]);
const MIN_P = 36, MAX_P = 97, N_P = MAX_P - MIN_P;
const KEY_W = 56, HDR_H = 22;
const BPB = 4, DEF_BARS = 8, DEF_VEL = 100;
const SUBDIV = 4;

let CELL_H, CELL_W;

const SYSTEM_PROMPT_BASE = `You are a professional music composition AI assistant embedded in a piano-roll editor. Help users create melodies, chord progressions, bass lines and arrangements by calling tools. You MUST respond in Chinese unless the user writes in another language.

PIANO ROLL SPECS: MIDI note range displayed: 36 (C2) – 96 (C7). Recommended melodic range: 48–84. Time is measured in beats (quarter-notes). Grid resolution: 0.25 beat (16th note). Default tempo 120 BPM, time-signature 4/4, velocity 100 (range 1-127).

TOOLS (always prefer add_notes for batches):
add_note(pitch, start_beat, duration, velocity=100) — pitch 36-96, start_beat float, duration 0.25/0.5/1/2/4
add_notes(notes) — batch: [{pitch, start_beat, duration, velocity?}, …]
remove_note(pitch, start_beat) — delete a note by pitch & exact start_beat
update_note(pitch, start_beat, new_pitch?, new_start_beat?, new_duration?, new_velocity?) — modify existing note
clear_all() — remove everything
get_notes() — returns current note list [{pitch, start_beat, duration, velocity}, …]
get_state() — returns {bpm, key:{root, scale, name}, time_signature:{num,den}, note_count}
set_tempo(bpm) — 40-300
set_key(root_note, scale_type) — root_note: MIDI num; scale_type: major|minor|pentatonic_major|pentatonic_minor|blues|dorian|mixolydian
set_time_signature(numerator, denominator)

NOTE → MIDI QUICK REF: C4=60 (middle C). Each octave +12. C=0 C#=1 D=2 D#=3 E=4 F=5 F#=6 G=7 G#=8 A=9 A#=10 B=11. C2=36 C3=48 D3=50 E3=52 F3=53 G3=55 A3=57 B3=59. C4=60 D4=62 E4=64 F4=65 G4=67 A4=69 B4=71. C5=72 D5=74 E5=76 F5=77 G5=79 A5=81 B5=83. C6=84 D6=86 E6=88 F6=89 G6=91 A6=93 B6=95. C7=96.

═══════════════════════════════════════
CRITICAL COMPOSITION RULES — OBEY STRICTLY
═══════════════════════════════════════

🔴 RULE 1 — RESTS & SILENCE ARE MANDATORY
NEVER make all notes connected back-to-back (no legato-only melodies). Silence IS a note.
- Every melodic phrase (2-4 beats) MUST end with at least 0.25–0.5 beat of silence before the next phrase.
- Use start_beat gaps: if note A ends at beat 2.0, next note should start at 2.25 or 2.5, NOT at 2.0.
- Longer phrases (4+ beats) need a 0.5–1.0 beat rest after them for "breathing."
- Short staccato-like notes: use duration 0.25 with 0.25 gap after (0.5 total slot), creating crisp articulation.
- Slow/emotional passages: longer gaps between phrases (0.5–1.0 beat rest) to create spaciousness.

🔴 RULE 2 — RHYTHMIC VARIETY (NEVER monotonous)
Every 4-bar section MUST mix at least 3 different note durations from {0.25, 0.5, 0.75, 1.0, 1.5, 2.0}.
Pattern to avoid: ████░░░░ (all quarter notes) — this sounds mechanical and rushed.
Good patterns mix short and long: 0.25 0.25 0.5 ░░ 1.0 0.5 0.25 0.25
Use dotted rhythms (0.75 beat) for swing feel: long-short-long-short.
Syncopation: place notes on off-beats (beat 0.5, 1.5, 2.5, 3.5) mixed with on-beat notes.

🔴 RULE 3 — VELOCITY DYNAMICS (expression is everything)
velocity range is 1-127. NEVER use same velocity for all notes.
- Main melody notes: velocity 80-110
- Passing/decoration notes: velocity 50-70
- Ghost notes (light filler): velocity 25-45
- Accent/emphasis notes (beat 1, climax): velocity 110-127
- Soft intro/outro notes: velocity 60-80
- Crescendo: velocity gradually increases across 2-4 notes (60→75→90→105)
- Each phrase should have a dynamic shape (crescendo or decrescendo), not flat.

🔴 RULE 4 — PHRASE STRUCTURE (call & response)
Each section MUST have clearly separated phrases, like sentences in a paragraph:
- Phrase A (question): 2-4 bars, rising contour, ends on non-tonic note (2, 4, 5, 7 scale degree) → REST 0.5 beat
- Phrase B (answer): 2-4 bars, falling contour, resolves to tonic (1, 3 scale degree) → REST 0.5 beat
- Phrase C (development): variation of A with different rhythm or register → REST
- Phrase D (conclusion): final resolution → REST

🔴 RULE 5 — DENSITY CONTROL
Music must "breathe" — not all bars equally full:
- Bar 1-2: moderate density (4-8 notes)
- Bar 3-4: higher density (6-12 notes, climax area)
- Bar 5-6: lower density (2-5 notes, released tension)
- Bar 7-8: resolution (1-4 notes, calm ending)
NOT: every bar has 8 notes (this sounds suffocating).

🔴 RULE 6 — HARMONY & COUNTERPOINT
- Chord tones (1,3,5) go on strong beats (beat 1, 3 in 4/4)
- Non-chord tones (2,4,6,7) as passing notes on weak beats or off-beats
- Avoid parallel octaves/fifths in polyphonic writing
- Use contrary motion between bass and melody for richness

🔴 RULE 7 — STYLE-SPECIFIC ADAPTATION
- Ballad/Slow: duration 1.0-2.0 dominant, velocity soft (60-90), large rests (0.5-1.0 beat gaps)
- Pop: duration 0.5-1.0 mixed, velocity balanced (70-100), moderate rests (0.25-0.5 beat)
- EDM/House: duration 0.25-0.5 dominant on bass, melody uses 0.5-1.0, tight rests
- Jazz: use swing (0.75 beat dotted), syncopation-heavy, velocity varied
- Classical: strict phrasing, clear cadences, 1.0 beat rests between phrases

🔴 RULE 0 — PRE-GENERATION WORKFLOW (do BEFORE calling add_notes)
Follow this mandatory sequence when the user asks you to write music:
1. IF you haven't checked the current state yet → call get_state() to learn BPM/key/time_signature
2. IF the user wants to modify/add to existing notes → call get_notes() to see what's already on the canvas
3. NEVER add notes blindly — always know the current state first
4. When the user says "change that last phrase" or "make it slower" → use update_note() to edit existing notes instead of deleting and re-adding
5. When the user says "make the melody softer" → use update_note() to lower velocity, NOT remove+add

Before generating ANY notes, mentally plan:
1. "Where are my rests?" (at least every 2 bars)
2. "What is my dynamic shape?" (velocity curve per phrase)
3. "What is my density pattern?" (varied across bars)
4. "What is my rhythmic variety?" (at least 3 durations per section)

Always explain what you wrote and the musical reasoning in Chinese.`;

let techniquesContent = '';

async function loadTechniques() {

// ═══ Responsive Canvas Sizing ══════════════════════════════════
function calcCellSize() {
  const availW = gridWrap.clientWidth || 800;
  const availH = window.innerHeight - toolbar.offsetHeight - statusEl.offsetHeight - 4;
  
  const minCellH = 14;
  const minCellW = 8;
  const maxCellW = 32;
  
  CELL_H = Math.max(minCellH, Math.floor(availH / N_P));
  
  const totalDivs = bars * BPB * SUBDIV;
  let cw = Math.floor((availW - KEY_W) / totalDivs);
  
  if (cw < minCellW) {
    const neededBars = Math.floor((availW - KEY_W) / (BPB * SUBDIV * minCellW));
    bars = Math.max(DEF_BARS, Math.min(64, neededBars + 2));
    CELL_W = minCellW;
  } else {
    CELL_W = Math.min(maxCellW, cw);
    const actualBars = Math.floor((availW - KEY_W) / (CELL_W * BPB * SUBDIV));
    bars = Math.max(DEF_BARS, Math.min(64, actualBars));
  }
  
  const remainingW = (availW - KEY_W) % (bars * BPB * SUBDIV);
  if (remainingW > 0 && CELL_W < maxCellW) {
    CELL_W = Math.min(maxCellW, CELL_W + 1);
  }
}

function paintAll() {
  calcCellSize();
  const tw = bars * BPB * SUBDIV * CELL_W;
  const th = N_P * CELL_H;
  const dpr = window.devicePixelRatio || 1;

  keysCv.width = KEY_W * dpr;
  keysCv.height = (HDR_H + th) * dpr;
  keysCv.style.width = KEY_W + 'px';
  keysCv.style.height = (HDR_H + th) + 'px';

  gridCv.width = tw * dpr;
  gridCv.height = (HDR_H + th) * dpr;
  gridCv.style.width = tw + 'px';
  gridCv.style.height = (HDR_H + th) + 'px';

  const gctx = gridCv.getContext('2d');
  const kctx = keysCv.getContext('2d');
  gctx.setTransform(dpr,0,0,dpr,0,0);
  kctx.setTransform(dpr,0,0,dpr,0,0);

  gctx.fillStyle = '#0e0e26'; gctx.fillRect(0,0,tw,HDR_H+th);
  gctx.fillStyle = '#0e0e28'; gctx.fillRect(0,0,tw,HDR_H);
  kctx.fillStyle = '#10102a'; kctx.fillRect(0,0,KEY_W,HDR_H+th);
  kctx.fillStyle = '#0e0e28'; kctx.fillRect(0,0,KEY_W,HDR_H);

  const fontSize = Math.max(7, Math.min(11, Math.floor(CELL_H * 0.65)));

  for (let i = 0; i < N_P; i++) {
    const p = MAX_P - 1 - i;
    const y = HDR_H + i * CELL_H;
    const s = p % 12;
    const isBlack = BLACK_KEYS.has(s);
    const isC = s === 0;
    let rowBg = '#0e0e26';
    if (isC) rowBg = '#161638'; else if (isBlack) rowBg = '#161636';
    gctx.fillStyle = rowBg; gctx.fillRect(0,y,tw,CELL_H);
    gctx.strokeStyle = isBlack ? '#222250' : '#111130';
    gctx.beginPath(); gctx.moveTo(0,y+CELL_H); gctx.lineTo(tw,y+CELL_H); gctx.stroke();

    let keyBg = '#10102a';
    if (isC) keyBg = '#161638'; else if (!isBlack) keyBg = '#1c1c3c';
    kctx.fillStyle = keyBg; kctx.fillRect(0,y,KEY_W,CELL_H);
    const nm = NOTE_NAMES[s] + (Math.floor(p/12)-1);
    kctx.fillStyle = isC ? '#8888bb' : '#555578';
    kctx.font = `${fontSize}px Consolas`; kctx.textAlign = 'right';
    kctx.fillText(nm, KEY_W-4, y+CELL_H/2+fontSize/3-1);
  }

  for (let bar = 0; bar < bars; bar++) {
    for (let beat = 0; beat < BPB; beat++) {
      for (let sub = 0; sub < SUBDIV; sub++) {
        const x = (bar*BPB+beat)*SUBDIV*CELL_W + sub*CELL_W;
        if (sub > 0) {
          gctx.strokeStyle = '#161636'; gctx.beginPath();
          gctx.moveTo(x,HDR_H); gctx.lineTo(x,HDR_H+th); gctx.stroke();
        }
      }
      const xb = (bar*BPB+beat)*SUBDIV*CELL_W;
      gctx.strokeStyle = '#222250'; gctx.beginPath();
      gctx.moveTo(xb,HDR_H); gctx.lineTo(xb,HDR_H+th); gctx.stroke();
    }
    const xm = bar*BPB*SUBDIV*CELL_W;
    gctx.strokeStyle = '#3a3a68'; gctx.lineWidth = 1;
    gctx.beginPath(); gctx.moveTo(xm,HDR_H); gctx.lineTo(xm,HDR_H+th); gctx.stroke();
    gctx.fillStyle = '#666688'; gctx.font = `${Math.max(8,fontSize)}px Consolas`; gctx.textAlign = 'left';
    gctx.fillText(String(bar+1), xm+3, HDR_H/2+fontSize/3);
  }

  for (const n of notes) {
    const p = n.pitch;
    if (p < MIN_P || p >= MAX_P) continue;
    const x1 = n.start_beat * SUBDIV * CELL_W;
    const y1 = HDR_H + (MAX_P-1-p) * CELL_H;
    const x2 = x1 + n.duration * SUBDIV * CELL_W;
    const y2 = y1 + CELL_H - 1;
    const t = (n.velocity||DEF_VEL)/127;
    const g = Math.floor(100+112*t);
    const bv = Math.floor(80+90*t);
    const isDraggingNote = isDragging && dragNote && n.pitch === dragNote.pitch && Math.abs(n.start_beat - dragNote.start_beat) < 0.001;
    const isResizingNote = isResizing && resizeNote && n.pitch === resizeNote.pitch && Math.abs(n.start_beat - resizeNote.start_beat) < 0.001;
    if (isDraggingNote) {
      gctx.fillStyle = '#ffff44';
      gctx.strokeStyle = '#ffffff';
    } else if (isResizingNote) {
      gctx.fillStyle = `rgb(0,${g},${bv})`;
      gctx.strokeStyle = '#ff44ff';
    } else {
      gctx.fillStyle = `rgb(0,${g},${bv})`;
      gctx.strokeStyle = '#00aa88';
    }
    gctx.fillRect(x1+1,y1+1,x2-x1-2,y2-y1-1);
    gctx.strokeRect(x1+1,y1+1,x2-x1-2,y2-y1-1);
  }
  updateNotesList();
}

const toolbar = document.getElementById('toolbar');

function pitchBeatFromXY(ex, ey) {
  const beat = ex / CELL_W / SUBDIV;
  const prow = Math.floor((ey - HDR_H) / CELL_H);
  if (prow < 0 || prow >= N_P) return null;
  return { pitch: MAX_P - 1 - prow, beat };
}

function findAt(pitch, beat) {
  return notes.find(n => n.pitch===pitch && beat>=n.start_beat && beat<n.start_beat+n.duration);
}

function findAtRightEdge(pitch, beat, px, cellW) {
  const threshold = Math.max(4, cellW * 0.4);
  for (const n of notes) {
    if (n.pitch !== pitch) continue;
    if (beat >= n.start_beat && beat <= n.start_beat + n.duration) {
      const rightEdgeBeat = n.start_beat + n.duration;
      const rightEdgeX = rightEdgeBeat * SUBDIV * cellW;
      const clickX = beat * SUBDIV * cellW;
      if (Math.abs(clickX - rightEdgeX) <= threshold) {
        return n;
      }
    }
  }
  return null;
}

function addNote(pitch, start, dur, vel) {
  pushHistory();
  _addNoteRaw(pitch, start, dur, vel);
}

function _addNoteRaw(pitch, start, dur, vel) {
  notes = notes.filter(n => !(n.pitch===pitch && Math.abs(n.start_beat-start)<0.001));
  notes.push({pitch, start_beat:start, duration:dur, velocity:vel||velDefault});
}

function rmNote(pitch, start) {
  pushHistory();
  notes = notes.filter(n => !(n.pitch===pitch && Math.abs(n.start_beat-start)<0.001));
}

gridCv.addEventListener('mousedown', e => {
  if (playing) return;
  if (e.button !== 0) return;
  const rect = gridCv.getBoundingClientRect();
  const scrollX = gridWrap.scrollLeft;
  const scrollY = gridWrap.scrollTop;
  const res = pitchBeatFromXY(e.clientX-rect.left+scrollX, e.clientY-rect.top+scrollY);
  if (!res) return;
  const snapB = Math.round(res.beat/0.25)*0.25;
  const resizeTarget = findAtRightEdge(res.pitch, res.beat, e.clientX-rect.left+scrollX, CELL_W);
  if (resizeTarget) {
    pushHistory();
    isResizing = true;
    resizeNote = resizeTarget;
    gridCv.style.cursor = 'ew-resize';
    e.preventDefault();
    return;
  }
  const ex = findAt(res.pitch, snapB);
  if (ex) {
    isDragging = true;
    dragNote = ex;
    dragStartX = e.clientX;
    dragStartBeat = ex.start_beat;
    dragStartPitch = ex.pitch;
    lastDragX = e.clientX;
    lastDragY = e.clientY;
    gridCv.style.cursor = 'grabbing';
    e.preventDefault();
  } else {
    const dur = parseFloat(durSel.value);
    addNote(res.pitch, snapB, dur);
    paintAll(); updateStatus();
  }
});

gridCv.addEventListener('mousemove', e => {
  if (playing) return;
  const rect = gridCv.getBoundingClientRect();
  const scrollX = gridWrap.scrollLeft;
  const scrollY = gridWrap.scrollTop;
  const res = pitchBeatFromXY(e.clientX-rect.left+scrollX, e.clientY-rect.top+scrollY);
  if (res) {
    const nm = NOTE_NAMES[res.pitch%12]+(Math.floor(res.pitch/12)-1);
    statusEl.textContent = `${nm} (MIDI ${res.pitch})  |  Beat ${res.beat.toFixed(2)}  |  Notes: ${notes.length}`;
    if (isResizing && resizeNote) {
      if (Math.abs(e.clientX - lastDragX) > 2) {
        let newDur = Math.max(0.25, res.beat - resizeNote.start_beat);
        newDur = Math.round(newDur / 0.25) * 0.25;
        if (Math.abs(newDur - resizeNote.duration) > 0.001) {
          resizeNote.duration = newDur;
          lastDragX = e.clientX;
          if (dragraf) cancelAnimationFrame(dragraf);
          dragraf = requestAnimationFrame(() => {
            paintAll();
            statusEl.textContent = `调整时值: ${nm} (MIDI ${res.pitch})  |  长度 ${newDur.toFixed(2)}`;
          });
        }
      }
    } else if (isDragging && dragNote) {
      if (Math.abs(e.clientX - lastDragX) > 3 || Math.abs(e.clientY - lastDragY) > 3) {
        const deltaX = e.clientX - dragStartX;
        const deltaBeat = deltaX / (SUBDIV * CELL_W);
        let newBeat = Math.max(0, dragStartBeat + deltaBeat);
        newBeat = Math.round(newBeat / 0.25) * 0.25;
        const deltaY = dragStartPitch - res.pitch;
        let newPitch = dragStartPitch;
        if (Math.abs(deltaY) >= 1) {
          newPitch = Math.max(MIN_P, Math.min(MAX_P - 1, dragStartPitch - deltaY));
          newPitch = Math.round(newPitch);
        }
        if (newPitch !== dragNote.pitch || newBeat !== dragNote.start_beat) {
          dragNote.pitch = newPitch;
          dragNote.start_beat = newBeat;
          lastDragX = e.clientX;
          lastDragY = e.clientY;
          if (dragraf) cancelAnimationFrame(dragraf);
          dragraf = requestAnimationFrame(() => {
            paintAll();
            const nm2 = NOTE_NAMES[newPitch%12]+(Math.floor(newPitch/12)-1);
            statusEl.textContent = `拖动中: ${nm2} (MIDI ${newPitch})  |  Beat ${newBeat.toFixed(2)}`;
          });
        }
      }
    } else if (!isDragging && !isResizing) {
      const hov = findAtRightEdge(res.pitch, res.beat, e.clientX-rect.left+scrollX, CELL_W);
      gridCv.style.cursor = hov ? 'ew-resize' : 'crosshair';
    }
  } else { updateStatus(); }
});

function updateKeyDisplay() {

}

function pushHistory() {
  notesHistory.push(notes.map(n => ({...n})));

function undo() {

}

// ═══ Sound Pack ═══════════════════════════════════════════════
async function loadSoundPack() {
  try {
    const resp = await fetch('/vocal/');
    if (!resp.ok) throw new Error('音效包目录不存在');
    const json = await resp.json();
    const files = json.files || [];
    if (files.length === 0) throw new Error('未找到支持的音频文件 (WAV/MP3/OGG/M4A/AAC/FLAC)');
    ensureAudio();
    const buffers = {};
    for (const file of files) {
      const fresp = await fetch('/vocal/' + encodeURIComponent(file));
      const buf = await fresp.arrayBuffer();
      const decoded = await audioCtx.decodeAudioData(buf);
      buffers[file] = decoded;
    }
    soundPack = buffers;
    const ext = files.length === 1 ? '.' + files[0].split('.').pop().toLowerCase() : '';
    soundPackName = files.length === 1 ? files[0].replace(ext, '') : `${files.length}个音效`;
    soundBadge.textContent = '🎵 ' + soundPackName;
    soundBadge.style.background = '#1a3a2a';
    soundBadge.style.color = '#44cc88';
  } catch(e) {
    soundPack = null;
    soundPackName = '';
    soundBadge.textContent = '🎵 默认音色';
    soundBadge.style.background = '';
    soundBadge.style.color = '';
  }
}

function ensureAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    masterGainNode = audioCtx.createGain();
    masterGainNode.gain.value = 0.8;
    masterGainNode.connect(audioCtx.destination);
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playNote(pitch, startTime, duration, vel) {
  if (!audioCtx) return;
  vel = vel || velDefault;
  if (soundPack) {
    playSample(pitch, startTime, duration, vel);
  } else {
    playSynth(pitch, startTime, duration, vel);
  }
}

function playSynth(pitch, startTime, duration, vel) {
  const freq = 440 * Math.pow(2, (pitch-69)/12);
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'triangle';
  osc.frequency.value = freq;
  const v = vel/127;
  gain.gain.setValueAtTime(v*0.25, startTime);
  gain.gain.exponentialRampToValueAtTime(0.001, startTime+duration*0.85);
  osc.connect(gain); gain.connect(masterGainNode||audioCtx.destination);
  osc.start(startTime); osc.stop(startTime+duration);
  scheduledOscs.push(osc);
}

function playSample(pitch, startTime, duration, vel) {
  if (!audioCtx || !soundPack) return;
  const semitonesFromC4 = pitch - 60;
  const pitchRatio = Math.pow(2, semitonesFromC4 / 12);
  const v = (vel/127) * 0.8;

  const keys = Object.keys(soundPack);
  if (keys.length === 0) return;
  const decoded = soundPack[keys[0]];
  const src = audioCtx.createBufferSource();
  src.buffer = decoded;
  src.playbackRate.value = pitchRatio;

  const gainNode = audioCtx.createGain();
  gainNode.gain.setValueAtTime(v, startTime);
  gainNode.gain.exponentialRampToValueAtTime(0.001, startTime + Math.min(duration * 0.85, decoded.duration * 0.9));

  src.connect(gainNode);
  gainNode.connect(masterGainNode||audioCtx.destination);
  src.start(startTime);
  scheduledOscs.push(src);
}

function stopAllAudio() {
  try { for (const o of scheduledOscs) { try { o.stop(); } catch(e){} } } catch(e){}
  scheduledOscs = [];
}

function animatePlayhead() {
  if (!playing) return;
  ensureAudio();
  const elapsed = audioCtx.currentTime - playStart;
  const beat = elapsed * bpm / 60;
  const total = bars * BPB;
  if (beat > total) { playing = false; paintAll(); updateStatus(); return; }
  paintAll();
  const gctx = gridCv.getContext('2d');
  const x = beat * SUBDIV * CELL_W;
  const sx = x - gridWrap.scrollLeft;
  gctx.strokeStyle = '#ff2255'; gctx.lineWidth = 2;
  gctx.beginPath(); gctx.moveTo(sx, HDR_H); gctx.lineTo(sx, HDR_H+N_P*CELL_H); gctx.stroke();
  gctx.lineWidth = 1;
  playAnimId = requestAnimationFrame(animatePlayhead);
}

function chatAppend(cls, text) {

  div.className = cls; div.textContent = text;
  chatMsgs.appendChild(div);
  chatMsgs.scrollTop = chatMsgs.scrollHeight;

let thinkingDiv = null;

function showThinking() {
  hideThinking();
  thinkingDiv = document.createElement('div');
  thinkingDiv.className = 'think';
  thinkingDiv.innerHTML = '<span style="font-size:12px;margin-right:2px">AI 思考中</span><span class="dot"></span><span class="dot"></span><span class="dot"></span>';
  chatMsgs.appendChild(thinkingDiv);

function hideThinking() {
  if (thinkingDiv && thinkingDiv.parentNode) {
    thinkingDiv.parentNode.removeChild(thinkingDiv);
  }
  thinkingDiv = null;
}

function renderMarkdown(text) {
  let html = escapeHtml(text);

  html = html.replace(/^#{4} (.+)$/gm, '<h4>$1</h4>');
  html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');

  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/__(.+?)__/g, '<strong>$1</strong>');
  html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
  html = html.replace(/_(.+?)_/g, '<em>$1</em>');

  html = html.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => {
    return '<pre><code>' + code.replace(/\n$/, '') + '</code></pre>';
  });
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

  html = html.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');

  html = html.replace(/(?:^|\n)(\d+)\. (.+)/g, (m, num, text, offset) => {
    const before = html.substring(0, offset);
    if (/(?:<li>|<ol>)/.test(before.slice(-200))) return '<li>' + text + '</li>';
    return '\n<ol>\n<li>' + text + '</li>\n</ol>';
  });
  html = html.replace(/<\/ol>\n<ol>/g, '');
  html = html.replace(/(?:^|\n)[-*] (.+)/g, (m, text, offset) => {
    const before = html.substring(0, offset);
    if (/<li>/.test(before.slice(-200)) && !/<\/(ol|ul)>/.test(before.slice(-200))) {
      return '<li>' + text + '</li>';
    }
    return '\n<ul>\n<li>' + text + '</li>\n</ul>';
  });
  html = html.replace(/<\/ul>\n<ul>/g, '');

  html = html.replace(/^---$/gm, '<hr>');

  html = html.replace(/\n\n/g, '<br><br>');
  html = html.replace(/\n/g, '<br>');

  return html;
}

function finalizeReasoning(reasoningDiv, reasoningContent) {
  if (!reasoningDiv || !reasoningDiv.parentNode) return;
  if (!reasoningContent) { reasoningDiv.parentNode.removeChild(reasoningDiv); return; }
  const details = document.createElement('details');
  details.className = 'reasoning';
  details.innerHTML = '<summary>💭 思考过程</summary><div class="rc">' + renderMarkdown(reasoningContent) + '</div>';
  reasoningDiv.parentNode.replaceChild(details, reasoningDiv);
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function chatSendMsg() {
  if (busy) return;
  const txt = chatInput.value.trim();
  if (!txt) return;
  chatInput.value = '';
  chatAppend('u', '\nYou:');
  chatAppend('ut', txt);
  messages.push({role:'user',content:txt});
  busy = true;
  chatSend.disabled = true;
  $('chat-stop').style.display = 'inline-block';
  statusEl.textContent = 'AI 正在思考…';
  showThinking();
  abortController = new AbortController();
  let iterations = 0;
  const MAX_ITER = 20;

  try {
    while (iterations < MAX_ITER) {
      iterations++;

      const body = {model: loadCfgModel(), messages, tools:TOOLS, stream: true};
      const resp = await fetch('/api/chat', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify(body),
        signal: abortController.signal
      });

      if (!resp.ok) {
        const e = await resp.json().catch(()=>({}));
        throw new Error(e.error||`HTTP ${resp.status}`);
      }

      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let sseBuf = '';
      let streamError = null;
      let toolCallsMsg = null;
      let aiContent = '';
      let aiDiv = null;
      let reasoningContent = '';
      let reasoningDiv = null;
      let streamDone = false;

      while (!streamDone) {
        const { done, value } = await reader.read();
        if (done) { streamDone = true; break; }

        sseBuf += decoder.decode(value, { stream: true });
        const lines = sseBuf.split('\n');
        sseBuf = lines.pop() || '';

        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          try {
            const evt = JSON.parse(line.slice(6));
            switch (evt.type) {
            case 'text':
              if (!aiDiv) {
                hideThinking();
                chatAppend('al', '\nAI:');
                aiDiv = document.createElement('div');
                aiDiv.className = 'at';
                chatMsgs.appendChild(aiDiv);
              }
              aiContent += evt.content;
              aiDiv.innerHTML = renderMarkdown(aiContent);
              chatMsgs.scrollTop = chatMsgs.scrollHeight;
              break;
            case 'tool_calls':
              toolCallsMsg = evt.message;
              break;
            case 'reasoning':
              if (!reasoningDiv) {
                hideThinking();
                const wrap = document.createElement('div');
                wrap.className = 'reasoning-stream';
                wrap.textContent = '';
                chatMsgs.appendChild(wrap);
                reasoningDiv = wrap;
              }
              reasoningContent += evt.content;
              reasoningDiv.innerHTML = renderMarkdown(reasoningContent);
              chatMsgs.scrollTop = chatMsgs.scrollHeight;
              break;
            case 'reasoning_done':
              reasoningContent = evt.content;
              break;
            case 'done':
              streamDone = true;
              break;
            case 'error':
              streamError = new Error(evt.message);
              streamDone = true;
              break;
            }
          } catch(e) { /* skip incomplete JSON */ }
        }
      }

      if (streamError) throw streamError;

      if (toolCallsMsg) {
        messages.push(toolCallsMsg);
        for (const tc of toolCallsMsg.tool_calls) {
          const fn = tc.function.name;
          const args = JSON.parse(tc.function.arguments);
          const res = execTool(fn, args);
          chatAppend('tt', `  ⚙ ${fn}(${JSON.stringify(args).slice(0,80)})`);
          messages.push({role:'tool',tool_call_id:tc.id,content:JSON.stringify(res)});
        }
        finalizeReasoning(reasoningDiv, reasoningContent);
        showThinking();
        statusEl.textContent = 'AI 正在思考…';
        continue;
      }

      finalizeReasoning(reasoningDiv, reasoningContent);
      if (aiContent) {
        const am = {role:'assistant',content:aiContent};
        if (reasoningContent) am.reasoning_content = reasoningContent;
        messages.push(am);
      } else if (reasoningContent) {
        messages.push({role:'assistant',content:'',reasoning_content:reasoningContent});
      }
      break;
    }

    if (iterations >= MAX_ITER) {
      chatAppend('et', '\n⚠ 达到最大迭代次数（' + MAX_ITER + '），对话已终止');
    }
  } catch(e) {
    if (e.name === 'AbortError') {
      chatAppend('tt', '\n⏹ 已停止生成');
    } else {
      chatAppend('et', '\n⚠ '+e.message);
    }
  } finally {
    hideThinking();
    busy = false;
    chatSend.disabled = false;
    $('chat-stop').style.display = 'none';
    abortController = null;
    paintAll(); updateStatus();
  }
}

// ═══ Tool Execution ══════════════════════════════════════════
function execTool(name, args) {
  try {
    switch(name) {
    case 'add_note': {
      const p=args.pitch, s=args.start_beat, d=args.duration, v=args.velocity;
      addNote(p,s,d,v); paintAll();
      return {ok:true, note:NOTE_NAMES[p%12]+(Math.floor(p/12)-1), beat:s, dur:d};
    }
    case 'add_notes': {
      pushHistory();
      let c=0;
      for (const nt of args.notes) {
        _addNoteRaw(nt.pitch, nt.start_beat, nt.duration, nt.velocity); c++;
      }
      paintAll(); return {ok:true, count:c};
    }
    case 'remove_note': {
      const b4=notes.length;
      rmNote(args.pitch, args.start_beat);
      paintAll(); return {ok: notes.length<b4};
    }
    case 'update_note': {
      const idx = notes.findIndex(n => n.pitch===args.pitch && Math.abs(n.start_beat-args.start_beat)<0.001);
      if (idx === -1) return {error:'note not found'};
      pushHistory();
      if (args.new_pitch !== undefined) notes[idx].pitch = args.new_pitch;
      if (args.new_start_beat !== undefined) notes[idx].start_beat = args.new_start_beat;
      if (args.new_duration !== undefined) notes[idx].duration = args.new_duration;
      if (args.new_velocity !== undefined) notes[idx].velocity = args.new_velocity;
      paintAll();
      return {ok:true, updated:NOTE_NAMES[notes[idx].pitch%12]+(Math.floor(notes[idx].pitch/12)-1)};
    }
    case 'clear_all':
      pushHistory();
      notes=[]; paintAll(); return {ok:true};
    case 'get_notes':
      return {notes, count:notes.length};
    case 'get_state':
      return {
        bpm, tempo:bpm,
        key:{root:currentKey.root, scale:currentKey.scale, name:NOTE_NAMES[currentKey.root%12]+' '+currentKey.scale},
        time_signature:{numerator:currentTimeSignature.num, denominator:currentTimeSignature.den},
        note_count:notes.length
      };
    case 'set_tempo':
      bpm=Math.max(40,Math.min(300,args.bpm));
      bpmInp.value=bpm; updateStatus();
      return {ok:true, bpm};
    case 'set_key':
      currentKey = { root: args.root_note, scale: args.scale_type };
      updateKeyDisplay();
      return {ok:true, key:NOTE_NAMES[args.root_note%12]+' '+args.scale_type};
    case 'set_time_signature':
      currentTimeSignature = { num: args.numerator, den: args.denominator };
      updateKeyDisplay();
      return {ok:true, ts:args.numerator+'/'+args.denominator};
    default: return {error:'unknown tool'};
    }
  } catch(e) { return {error:e.message}; }
}

    messages = [{role:'system',content:buildSystemPrompt()}];
    statusEl.textContent = '配置已保存';
  } catch(e) {
    alert('保存配置失败: '+e.message);
  }
});

modalOverlay.addEventListener('click', e => {
  if (e.target===modalOverlay) modalOverlay.classList.remove('active');
});

// ═══ AMR Terminal ═════════════════════════════════════════════
const termOverlay = $('term-overlay');
const termOutput = $('term-output');
const termInput = $('term-input');
const termClose = $('term-close');
const termStatus = $('term-status');
let termOpen = false;

function termPrint(cls, text) {
  const div = document.createElement('div');
  div.className = cls || '';
  div.textContent = text;
  termOutput.appendChild(div);
  termOutput.scrollTop = termOutput.scrollHeight;
}

function termHTML(html) {
  const div = document.createElement('div');
  div.innerHTML = html;
  termOutput.appendChild(div);
  termOutput.scrollTop = termOutput.scrollHeight;
}

function openTerminal() {
  if (termOpen) return;
  termOpen = true;
  termOverlay.classList.add('active');
  termInput.value = '';
  termInput.focus();
  termStatus.textContent = 'AMR Terminal 就绪';
  if (!termOutput.textContent) {
    termPrint('info', 'AMR Terminal v1.0 — 输入 amr help 查看命令');
    termPrint('', '');
  }
}

function closeTerminal() {
  termOpen = false;
  termOverlay.classList.remove('active');
}

async function execTermCmd(raw) {
  const cmd = raw.trim();
  if (!cmd) return;
  termPrint('cmd', '> ' + cmd);
  termStatus.textContent = '执行中…';

  try {
    if (cmd === 'clear' || cmd === 'cls') {
      termOutput.innerHTML = '';
      termStatus.textContent = 'AMR Terminal 就绪';
    }
    else if (cmd === 'help' || cmd === 'amr help' || cmd === '?') {
      termPrint('info', '可用命令:');
      termPrint('', '  amr state     — 查看服务运行状态、内存、MIDI 服务');
      termPrint('', '  amr terminal  — 查看服务器最近日志');
      termPrint('', '  amr api       — 查看所有 API 接口');
      termPrint('', '  clear / cls   — 清屏');
      termPrint('', '  help          — 帮助');
      termStatus.textContent = '就绪';
    }
    else if (cmd === 'amr state') {
      const resp = await fetch('/api/state');
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.error);
      termPrint('info', '═'.repeat(40));
      termPrint('info', '  Server');
      termPrint('',     `    Status:    ${data.server.status}`);
      termPrint('',     `    Uptime:    ${data.server.uptime}`);
      termPrint('',     `    Port:      ${data.server.port}`);
      termPrint('',     `    Node:      ${data.server.node}`);
      termPrint('',     `    Platform:  ${data.server.platform} (${data.server.arch})`);
      termPrint('info', '  Memory');
      termPrint('',     `    RSS:       ${data.memory.rss}`);
      termPrint('',     `    HeapUsed:  ${data.memory.heapUsed} / ${data.memory.heapTotal}`);
      termPrint('info', '  MIDI Service');
      termPrint('',     `    Status:    ${data.midi.status} (${data.midi.generator})`);
      termPrint('info', '  Config');
      termPrint('',     `    Provider:  ${data.config.provider || '—'}`);
      termPrint('',     `    Model:     ${data.config.model || '—'}`);
      termPrint('',     `    Logs:      ${data.logs}`);
      termStatus.textContent = '状态检查完成';
    }
    else if (cmd === 'amr terminal') {
      const resp = await fetch('/api/terminal?n=30');
      const logs = await resp.json();
      if (!resp.ok) throw new Error(logs.error);
      for (const l of logs) {
        const time = l.time.slice(11, 19);
        const cls = l.level === 'error' ? 'err' : l.level === 'info' ? 'info' : 'time';
        termPrint(cls, `[${time}] ${l.msg}`);
      }
      if (logs.length === 0) termPrint('', '(无日志)');
      termStatus.textContent = `${logs.length} 条日志`;
    }
    else if (cmd === 'amr api') {
      const resp = await fetch('/api/api');
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.error);
      termPrint('info', `API 接口列表 (${data.endpoints.length}):`);
      termPrint('info', '═'.repeat(60));
      for (const ep of data.endpoints) {
        const streamTag = ep.stream ? ' 🔄' : '';
        const bodyTag = ep.body ? ` (body:${ep.body})` : '';
        termPrint('',  `  ${ep.method.padEnd(6)} ${ep.path.padEnd(18)} ${ep.desc}${streamTag}${bodyTag}`);
      }
      termStatus.textContent = `${data.endpoints.length} 个接口`;
    }
    else {
      termPrint('err', `未知命令: ${cmd}，输入 help 查看帮助`);
      termStatus.textContent = '命令未识别';
    }
  } catch(e) {
    termPrint('err', '错误: ' + e.message);
    termStatus.textContent = '错误';
  }
}

termInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    execTermCmd(termInput.value);
    termInput.value = '';
  }
  if (e.key === 'Escape') closeTerminal();
});

termClose.addEventListener('click', closeTerminal);

document.addEventListener('keydown', e => {
  if ((e.key === '`' || e.key === '~') && !e.ctrlKey && !e.metaKey) {
    const tag = document.activeElement?.tagName;
    const isInput = tag === 'INPUT' || tag === 'TEXTAREA' || document.activeElement?.isContentEditable;
    if (!isInput || document.activeElement === termInput) {
      e.preventDefault();
      if (termOpen) closeTerminal(); else openTerminal();
      return;
    }
  }
  if (e.ctrlKey && e.key === 'z') { e.preventDefault(); undo(); return; }
  if (e.key === 'Delete' && !playing) {
    if (notes.length && confirm('删除所有音符？')) { pushHistory(); notes = []; paintAll(); updateStatus(); }
  }
});
</script>
