<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Piano Roll</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="toolbar">
  <label>BPM:</label>
  <input id="bpm-inp" type="number" value="120" min="40" max="300" style="width:58px">
  <label>时值:</label>
  <input id="dur-inp" type="number" value="1.0" min="0.25" max="8" step="0.25" style="width:68px">
  <span class="sep">│</span>
  <label>力度:</label>
  <input id="vel-slider" type="range" min="1" max="127" value="100">
  <span id="vel-label" style="color:var(--acc);font-size:11px;min-width:28px">100</span>
  <span class="sep">│</span>
  <button class="btn-play" id="btn-play">▶ 播放</button>
  <button class="btn-stop" id="btn-stop">■ 停止</button>
  <button class="btn-midi" id="btn-midi">⬇ MIDI</button>
  <button class="btn-clear" id="btn-clear">✕ 清除</button>
  <span class="sep">│</span>
  <button class="btn-save" id="btn-save">💾 保存</button>
  <button class="btn-clear-saved" id="btn-clear-saved">🗑️ 清除记录</button>
  <span class="sep">│</span>
  <label>音量:</label>
  <input id="vol-slider" type="range" min="0" max="100" value="80" style="width:70px;accent-color:var(--acc)">
  <span class="sep">│</span>
  <span id="key-display" style="color:var(--note);font-size:11px;white-space:nowrap">C Major · 4/4</span>
  <span style="flex:1"></span>
  <span id="sound-badge">🎵 默认音色</span>
  <button class="btn-config" id="btn-config">⚙ 配置</button>
</div>

<div id="main">
  <div id="roll-panel">
    <canvas id="keys-canvas"></canvas>
    <div id="grid-wrap">
      <canvas id="grid-canvas"></canvas>
    </div>
  </div>
  <div id="notes-panel">
    <div id="notes-title">🎼 音符列表 <span style="float:right;color:#666;font-weight:normal">共 0 个</span></div>
    <div id="notes-list"></div>
    <div style="padding:6px;border-top:1px solid #1a1a3a">
      <button id="btn-export-text" class="btn-export">📝 导出文本格式</button>
      <button id="btn-export-json" class="btn-export">📦 导出 JSON</button>
      <label style="display:block;margin-top:4px">
        <button id="btn-import-json" class="btn-import" onclick="$('import-file').click()">📥 导入 JSON</button>
        <input id="import-file" type="file" accept=".json" style="display:none">
      </label>
    </div>
  </div>
  <div id="chat-panel">
    <div id="chat-title">🎵 AI 作曲助手 <button id="btn-new-chat" style="float:right;background:#2a2a4a;color:var(--txtd);border:1px solid #3a3a5a;border-radius:3px;font-size:10px;padding:2px 8px;cursor:pointer;font-family:Consolas,monospace">新对话</button></div>
    <div id="chat-msgs"></div>
    <div id="chat-input-wrap">
      <input id="chat-input" placeholder="告诉 AI 你想创作什么音乐…" autocomplete="off">
      <button id="chat-send">发送</button>
      <button id="chat-stop" style="display:none;background:#aa4444;color:#fff;border:none;border-radius:3px;padding:7px 12px;cursor:pointer;font-family:Consolas,monospace;font-size:11px;font-weight:bold">⏹ 停止</button>
    </div>
  </div>
</div>

<div id="status">就绪</div>

<div id="modal-overlay">
  <div id="modal">
    <h2>🎹 AI Piano Roll — API 配置</h2>
    <p class="desc">请配置 AI 模型连接信息</p>
    <div class="row"><label>类型:</label>
      <label style="margin-right:12px"><input type="radio" name="cfg-provider" value="cloud" checked> 云端 (OpenAI/兼容API)</label>
      <label><input type="radio" name="cfg-provider" value="local"> 本地 (Ollama/LM Studio)</label>
    </div>
    <div class="row"><label>Base URL:</label><input id="cfg-url" placeholder="https://api.openai.com/v1 或 http://127.0.0.1:1234"></div>
    <div class="row"><label>API Key:</label><input id="cfg-key" type="password" placeholder="本地模型可留空">
      <small id="cfg-key-hint" style="display:none;color:#888;margin-left:8px">本地模型不需要API Key</small>
    </div>
    <div class="row"><label>模型:</label><input id="cfg-model" placeholder="gpt-4o / llama3.2 / phi3"></div>
    <div class="row"><label>提示词:</label><select id="cfg-prompt" style="flex:1;background:#252525;color:#e0e0e0;border:1px solid #3a3a3a;border-radius:8px;padding:7px 10px;font-family:inherit;font-size:12px;outline:none"></select></div>
    <div id="cfg-feedback"></div>
    <div class="btns">
      <button class="test" id="cfg-test">测试连接</button>
      <span style="flex:1"></span>
      <button class="cancel" id="cfg-cancel">取消</button>
      <button class="ok" id="cfg-save">保存</button>
    </div>
  </div>
</div>

<div id="term-overlay">
  <div id="term-header">
    <span>⬛</span> AMR Terminal
    <span>|</span>
    <span id="term-status">按 ESC 关闭 · ~ 切换</span>
    <button id="term-close">✕ ESC</button>
  </div>
  <div id="term-output"></div>
  <div id="term-input-wrap">
    <span id="term-prompt">&gt; </span>
    <input id="term-input" placeholder="输入 amr state / amr terminal / amr api …" autocomplete="off">
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
